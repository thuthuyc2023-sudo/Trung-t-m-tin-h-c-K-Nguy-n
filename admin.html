<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản trị — Kỷ Nguyên</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="admin-page">

  <!-- LOGIN VIEW -->
  <div class="admin-login" id="adminLoginView">
    <div class="admin-login__card">
      <h1>Quản trị Kỷ Nguyên</h1>
      <p class="admin-sub">Đăng nhập để xem danh sách đăng ký tư vấn.</p>

      <form id="adminLoginForm" novalidate>
        <div class="field">
          <label for="adminEmail">Email</label>
          <input type="email" id="adminEmail" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="adminPassword">Mật khẩu</label>
          <input type="password" id="adminPassword" autocomplete="current-password" required>
        </div>
        <span class="field__error" id="adminLoginError"></span>
        <button type="submit" class="btn btn--primary btn--lg" id="adminLoginBtn">Đăng nhập</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="adminDashView" hidden>
    <header class="admin-header">
      <a href="index.html" class="nav__logo">
        <span class="nav__logo-mark">KN</span>
        <span class="nav__logo-text">Kỷ Nguyên — Quản trị</span>
      </a>
      <div class="admin-header__actions">
        <span class="admin-header__user" id="adminUserEmail"></span>
        <button type="button" class="btn btn--ghost btn--sm" id="adminLogoutBtn">Đăng xuất</button>
      </div>
    </header>

    <main class="admin-main">
      <div class="admin-tabs">
        <button type="button" class="admin-tab is-active" data-tab="panelRegistrations">Đăng ký tư vấn</button>
        <button type="button" class="admin-tab" data-tab="panelTestimonials">Đánh giá học viên</button>
        <button type="button" class="admin-tab" data-tab="panelSchedules">Lịch khai giảng</button>
      </div>

      <!-- TAB: Đăng ký tư vấn -->
      <section class="admin-panel" id="panelRegistrations">
        <div class="admin-main__bar">
          <h2>Danh sách đăng ký tư vấn</h2>
          <div style="display:flex; align-items:center; gap:14px;">
            <span id="adminRowCount"></span>
            <button type="button" class="btn btn--ghost btn--sm" id="adminRefreshBtn">Tải lại</button>
          </div>
        </div>

        <p class="admin-error" id="adminLoadError" hidden></p>
        <p class="admin-empty" id="adminEmptyState" hidden>Chưa có đăng ký nào.</p>

        <table class="admin-table">
          <thead>
            <tr>
              <th>Họ tên</th>
              <th>SĐT</th>
              <th>Email</th>
              <th>Nội dung</th>
              <th>Trang</th>
              <th>Thời gian</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="adminTableBody"></tbody>
        </table>
      </section>

      <!-- TAB: Đánh giá học viên -->
      <section class="admin-panel" id="panelTestimonials" hidden>
        <div class="admin-main__bar">
          <h2>Đánh giá học viên</h2>
          <button type="button" class="btn btn--primary btn--sm" id="testimonialAddToggle">+ Thêm đánh giá</button>
        </div>

        <form id="testimonialForm" class="admin-inline-form" hidden>
          <div class="admin-inline-form__row">
            <input type="text" id="tName" placeholder="Tên học viên" required>
            <input type="text" id="tRole" placeholder="Vai trò (VD: Sinh viên CNTT)">
            <select id="tCourse">
              <option value="mos">MOS</option>
              <option value="java">Lập trình Java</option>
              <option value="ai">Ứng dụng AI</option>
            </select>
          </div>
          <textarea id="tContent" placeholder="Nội dung đánh giá" rows="2" required></textarea>
          <input type="url" id="tAvatar" placeholder="Link ảnh đại diện (không bắt buộc — chỉ dùng khi học viên đồng ý và ảnh là thật)">
          <span class="field__error" id="testimonialError"></span>
          <button type="submit" class="btn btn--primary btn--sm" id="testimonialSaveBtn">Lưu đánh giá</button>
        </form>

        <table class="admin-table">
          <thead>
            <tr><th>Tên</th><th>Vai trò</th><th>Khóa</th><th>Nội dung</th><th></th></tr>
          </thead>
          <tbody id="testimonialTableBody"></tbody>
        </table>
      </section>

      <!-- TAB: Lịch khai giảng -->
      <section class="admin-panel" id="panelSchedules" hidden>
        <div class="admin-main__bar">
          <h2>Lịch khai giảng</h2>
          <button type="button" class="btn btn--primary btn--sm" id="scheduleAddToggle">+ Thêm lịch</button>
        </div>

        <form id="scheduleForm" class="admin-inline-form" hidden>
          <div class="admin-inline-form__row">
            <select id="sCourse">
              <option value="mos">MOS</option>
              <option value="java">Lập trình Java</option>
              <option value="ai">Ứng dụng AI</option>
            </select>
            <input type="date" id="sDate" required>
            <input type="number" id="sTotal" placeholder="Tổng số chỗ" value="20" min="1">
            <input type="number" id="sFilled" placeholder="Đã đăng ký" value="0" min="0">
          </div>
          <span class="field__error" id="scheduleError"></span>
          <button type="submit" class="btn btn--primary btn--sm" id="scheduleSaveBtn">Lưu lịch khai giảng</button>
        </form>

        <table class="admin-table">
          <thead>
            <tr><th>Khóa</th><th>Ngày khai giảng</th><th>Tổng chỗ</th><th>Đã ĐK</th><th>Còn lại</th><th>Trạng thái</th><th></th></tr>
          </thead>
          <tbody id="scheduleTableBody"></tbody>
        </table>
      </section>
    </main>
  </div>

</div>

<script src="js/supabase-config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
